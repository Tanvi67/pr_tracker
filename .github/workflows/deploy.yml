name: PR Tracker CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tanvi67/pr-tracker

jobs:
  # ----------------------------------------------------------------------
  # STAGE 1: Code Validation & Quality Checks
  # ----------------------------------------------------------------------
  validate:
    name: Lint & Validate Codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: pr-tracker-client/package-lock.json

      - name: Install Client dependencies
        run: |
          cd pr-tracker-client
          npm ci

      - name: Run Client Linting
        run: |
          cd pr-tracker-client
          npm run lint --if-present

      - name: Validate Client Production Build
        run: |
          cd pr-tracker-client
          npm run build

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet

  # ----------------------------------------------------------------------
  # STAGE 2: Build & Push Multi-Service Docker Images
  # ----------------------------------------------------------------------
  build-and-push:
    name: Build & Push Container Images
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. PR Tracker Client
      - name: Build and push Client
        uses: docker/build-push-action@v5
        with:
          context: ./pr-tracker-client
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-client:latest
          build-args: |
            VITE_SERVER_ENDPOINT=${{ secrets.VITE_SERVER_ENDPOINT || 'http://localhost:5000' }}

      # 2. Service Router / API Gateway
      - name: Build and push Service Router
        uses: docker/build-push-action@v5
        with:
          context: ./pr-tracker-service-router
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-service-router:latest

      # 3. Main Backend Service
      - name: Build and push Main Backend
        uses: docker/build-push-action@v5
        with:
          context: ./pr-tracker-main-backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-main-backend:latest

      # 4. Auth & User Backend
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./pr-tracker-backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest

      # 5. AI Agent Microservice
      - name: Build and push AI Agent
        uses: docker/build-push-action@v5
        with:
          context: ./pr-tracker-ai-agent
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ai-agent:latest

      # 6. MongoDB Service
      - name: Build and push MongoDB Service
        uses: docker/build-push-action@v5
        with:
          context: ./pr-tracker-mongodb
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mongodb:latest

  # ----------------------------------------------------------------------
  # STAGE 3: Continuous Deployment to AWS EC2
  # ----------------------------------------------------------------------
  deploy-to-ec2:
    name: Deploy Stack to AWS EC2
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository for deployment manifests
        uses: actions/checkout@v4

      - name: Copy deployment manifests to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: "docker-compose.yml,docker-compose.monitoring.yml,nagios/"
          target: "/home/ubuntu/pr-tracker"

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            set -e
            echo "🚀 Starting automated deployment on EC2 host..."
            
            mkdir -p /home/ubuntu/pr-tracker
            cd /home/ubuntu/pr-tracker
            
            # Pull latest public images from GitHub Container Registry
            echo "📦 Pulling latest container images..."
            docker compose pull
            
            # Recreate containers with zero downtime
            echo "🔄 Launching updated services..."
            docker compose up -d --remove-orphans
            
            # Wait for gateway to boot and verify health with retry loop
            echo "⏳ Verifying application health endpoint..."
            for i in {1..12}; do
              if curl -s -f http://localhost:5000/api/health > /dev/null; then
                echo "✅ Health check succeeded!"
                break
              fi
              echo "Waiting for API Gateway to become ready... ($i/12)"
              sleep 4
            done
            
            # Final check to print the output
            curl -f http://localhost:5000/api/health
            echo ""
            echo "🎉 Deployment completed successfully!"
