###############################################################################
# PR TRACKER DEVOPS - NAGIOS SERVICE CHECKS
###############################################################################

# 1. PING / Host Reachability Check
define service {
    use                     generic-service
    host_name               pr-tracker-server
    service_description     Host Ping
    check_command           check_ping!100.0,20%!500.0,60%
}

# 2. Disk Space Monitoring
define service {
    use                     generic-service
    host_name               pr-tracker-server
    service_description     Root Partition Disk Usage
    check_command           check_local_disk!20%!10%!/
}

# 3. CPU Load Monitoring
define service {
    use                     generic-service
    host_name               pr-tracker-server
    service_description     Current CPU Load
    check_command           check_local_load!5.0,4.0,3.0!10.0,6.0,4.0
}

# 4. Total Processes Monitoring
define service {
    use                     generic-service
    host_name               pr-tracker-server
    service_description     Total Processes
    check_command           check_local_procs!250!400!RSZDT
}

# 5. Application Frontend Availability (Port 80 - React Web Client)
define service {
    use                     generic-service
    host_name               pr-tracker-server
    service_description     PR Tracker Frontend Web Client (Port 80)
    check_command           check_http_port!80
    notification_interval   15
    check_interval          2
}

# 6. Service Router / API Gateway Health Check (Port 5000 - /api/health)
define service {
    use                     generic-service
    host_name               pr-tracker-server
    service_description     API Gateway Service Router Health (/api/health)
    check_command           check_http_api_health!5000!/api/health
    notification_interval   15
    check_interval          2
}

# 7. Core Main Backend Service Health (Port 5002)
define service {
    use                     generic-service
    host_name               pr-tracker-server
    service_description     Core Backend Microservice (Port 5002)
    check_command           check_tcp_port!5002
}

# 8. AI Agent Service Health (Port 5003)
define service {
    use                     generic-service
    host_name               pr-tracker-server
    service_description     AI Agent Microservice (Port 5003)
    check_command           check_tcp_port!5003
}

# 9. MongoDB Service Health (Port 5004)
define service {
    use                     generic-service
    host_name               pr-tracker-server
    service_description     MongoDB Microservice (Port 5004)
    check_command           check_tcp_port!5004
}
