###############################################################################
# PR TRACKER DEVOPS - NAGIOS HOST DEFINITIONS
###############################################################################

# Monitored EC2 Host / Local Host
define host {
    use                     linux-server
    host_name               pr-tracker-server
    alias                   PR Tracker AWS EC2 Instance
    address                 127.0.0.1
    max_check_attempts      3
    check_period            24x7
    notification_interval   30
    notification_period     24x7
    contact_groups          admins
}
