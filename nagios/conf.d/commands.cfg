###############################################################################
# PR TRACKER DEVOPS - NAGIOS COMMAND DEFINITIONS
###############################################################################

# Command to check standard HTTP port
define command {
    command_name    check_http_port
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$
}

# Command to check specific HTTP API path (e.g. /api/health)
define command {
    command_name    check_http_api_health
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$ -u $ARG2$ -s "ok"
}

# Command to check TCP port connectivity
define command {
    command_name    check_tcp_port
    command_line    $USER1$/check_tcp -H $HOSTADDRESS$ -p $ARG1$
}
