---
- name: Provision and Deploy PR Tracker Stack on AWS EC2
  hosts: pr_tracker_hosts
  become: true
  vars:
    app_dir: "/home/ubuntu/pr-tracker"
    deploy_user: "ubuntu"
    ghcr_registry: "ghcr.io"

  tasks:
    - name: Wait for system to be reachable via SSH
      ansible.builtin.wait_for_connection:
        timeout: 180

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install system dependencies and monitoring tools
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - git
          - htop
          - ufw
          - net-tools
          - nagios-plugins
          - nagios-nrpe-server
        state: present

    # -------------------------------------------------------------
    # Docker Engine & Docker Compose Installation
    # -------------------------------------------------------------
    - name: Create keyrings directory for apt
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker official repository to apt sources
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Ensure Docker daemon is running and enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        groups: docker
        append: yes

    # -------------------------------------------------------------
    # Application Directory and Files Setup
    # -------------------------------------------------------------
    - name: Ensure deployment directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: '0755'

    - name: Copy docker-compose.yml to EC2 host
      ansible.builtin.copy:
        src: ../docker-compose.yml
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: '0644'

    - name: Copy .env to EC2 host if present
      ansible.builtin.copy:
        src: ../.env
        dest: "{{ app_dir }}/.env"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: '0600'
      ignore_errors: true

    - name: Copy Nagios configuration directory
      ansible.builtin.copy:
        src: ../nagios
        dest: "{{ app_dir }}/"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: '0755'
      ignore_errors: true

    # -------------------------------------------------------------
    # Container Pull and Deployment
    # -------------------------------------------------------------
    - name: Pull latest application container images
      ansible.builtin.command:
        cmd: docker compose pull
        chdir: "{{ app_dir }}"
      become_user: "{{ deploy_user }}"
      register: pull_result
      ignore_errors: true

    - name: Launch PR Tracker multi-service stack with Docker Compose
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans
        chdir: "{{ app_dir }}"
      become_user: "{{ deploy_user }}"

    - name: Verify running containers
      ansible.builtin.command:
        cmd: docker compose ps
        chdir: "{{ app_dir }}"
      become_user: "{{ deploy_user }}"
      register: compose_ps_output

    - name: Display running containers output
      ansible.builtin.debug:
        var: compose_ps_output.stdout_lines

    # -------------------------------------------------------------
    # Nagios NRPE Host Monitoring Configuration
    # -------------------------------------------------------------
    - name: Enable and restart Nagios NRPE server
      ansible.builtin.service:
        name: nagios-nrpe-server
        state: restarted
        enabled: yes
      ignore_errors: true
