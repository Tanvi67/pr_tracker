services:
  client:
    image: ghcr.io/tanvi67/pr-tracker-client:latest
    build:
      context: ./pr-tracker-client
      dockerfile: Dockerfile
      args:
        VITE_SERVER_ENDPOINT: http://localhost:5000
    container_name: pr-tracker-client
    ports:
      - "80:80"
    depends_on:
      - service-router
    networks:
      - pr-tracker-net
    restart: unless-stopped

  service-router:
    image: ghcr.io/tanvi67/pr-tracker-service-router:latest
    build:
      context: ./pr-tracker-service-router
      dockerfile: Dockerfile
    container_name: pr-tracker-service-router
    ports:
      - "5000:5000"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=5000
    depends_on:
      - main-backend
      - backend
      - ai-agent
      - mongodb
    networks:
      - pr-tracker-net
    restart: unless-stopped

  main-backend:
    image: ghcr.io/tanvi67/pr-tracker-main-backend:latest
    build:
      context: ./pr-tracker-main-backend
      dockerfile: Dockerfile
    container_name: pr-tracker-main-backend
    ports:
      - "5002:5002"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=5002
    networks:
      - pr-tracker-net
    restart: unless-stopped

  ai-agent:
    image: ghcr.io/tanvi67/pr-tracker-ai-agent:latest
    build:
      context: ./pr-tracker-ai-agent
      dockerfile: Dockerfile
    container_name: pr-tracker-ai-agent
    ports:
      - "5003:5003"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=5003
    networks:
      - pr-tracker-net
    restart: unless-stopped

  mongodb:
    image: ghcr.io/tanvi67/pr-tracker-mongodb:latest
    build:
      context: ./pr-tracker-mongodb
      dockerfile: Dockerfile
    container_name: pr-tracker-mongodb
    ports:
      - "5004:5004"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=5004
    networks:
      - pr-tracker-net
    restart: unless-stopped

  backend:
    image: ghcr.io/tanvi67/pr-tracker-backend:latest
    build:
      context: ./pr-tracker-backend
      dockerfile: Dockerfile
    container_name: pr-tracker-backend
    ports:
      - "5005:5005"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=5005
    networks:
      - pr-tracker-net
    restart: unless-stopped

  nagios:
    image: jasonrivers/nagios:latest
    container_name: pr-tracker-nagios
    ports:
      - "8080:80"
    volumes:
      - ./nagios/conf.d:/opt/nagios/etc/conf.d:ro
    environment:
      - NAGIOSADMIN_USER=nagiosadmin
      - NAGIOSADMIN_PASS=admin123
      - NAGIOS_TIMEZONE=UTC
    networks:
      - pr-tracker-net
    restart: unless-stopped

networks:
  pr-tracker-net:
    driver: bridge
